  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#E5C07B" stroke-width="2.5"
          stroke-dasharray="44 16" stroke-linecap="round" transform="rotate(35 16 16)"/>
  <circle cx="16" cy="16" r="3.6" fill="#E5C07B"/>
</svg>
